<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e叶知秋授信平台 · 后台管理系统</title>
<style>
/* ================= Gentelella 风格基座 ================= */
:root{
  --side:#2A3F54; --side-hover:#33475c; --side-sub:#24364a;
  --accent:#1ABB9C; --accent-d:#16a085;
  --body:#F7F7F7; --panel:#ffffff; --line:#E6E9ED;
  --ink:#333c46; --ink2:#73879C; --ink3:#93a5b8;
  --red:#E74C3C; --orange:#F39C12; --blue:#3498DB; --purple:#9B59B6;
  --shadow:0 1px 2px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;background:var(--body);color:var(--ink);font-size:13px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
a{color:var(--accent-d);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c3ccd6;border-radius:5px}

/* ================= 登录页 ================= */
.login-wrap{display:none;min-height:100vh;background:linear-gradient(135deg,#1f3043 0%,#2A3F54 55%,#1ABB9C 140%);align-items:center;justify-content:center;padding:20px}
.login-wrap.show{display:flex}
.login-card{background:#fff;width:100%;max-width:400px;border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden}
.login-head{background:var(--side);color:#fff;padding:26px 30px;text-align:center}
.login-head .logo{width:52px;height:52px;border-radius:12px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.login-head h1{font-size:20px;letter-spacing:1px}
.login-head p{font-size:12px;opacity:.75;margin-top:4px}
.login-body{padding:26px 30px 30px}
.login-body .tip{background:#eafaf6;border:1px solid #bfe9de;color:#0f7a63;font-size:12px;border-radius:6px;padding:8px 12px;margin-bottom:16px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ================= 主体框架 ================= */
.app{display:none}
.app.show{display:block}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--side);z-index:300;overflow-y:auto;transition:width .2s,left .2s}
.side-brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:56px;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);background:#24364a}
.side-brand .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.side-brand b{font-size:16px;letter-spacing:.5px;white-space:nowrap}
.side-brand span{font-size:10px;opacity:.6;display:block;white-space:nowrap}
.side-profile{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.side-profile .who{color:#fff;font-size:13px;font-weight:600}
.side-profile .role{color:#8fa5ba;font-size:11px}
.menu-sec{color:#6d86a0;font-size:10px;letter-spacing:2px;padding:14px 16px 6px}
.menu-item{display:flex;align-items:center;gap:11px;padding:10px 16px;color:#c3d0de;font-size:13px;border:none;background:none;width:100%;text-align:left;transition:.15s;border-left:3px solid transparent}
.menu-item svg{flex:none;opacity:.85}
.menu-item:hover{background:var(--side-hover);color:#fff}
.menu-item.on{background:var(--side-sub);color:#fff;border-left-color:var(--accent)}
.menu-item.on svg{opacity:1}
.menu-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:1px 7px;font-weight:700}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);margin-top:8px}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.25);color:#c3d0de;font-size:12px;border-radius:4px;padding:5px 12px;width:100%}
.side-foot button:hover{background:rgba(255,255,255,.1);color:#fff}

.main{margin-left:230px;min-height:100vh;transition:margin .2s}
.topbar{background:#fff;height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:200}
.top-toggle{border:none;background:none;color:var(--ink2);padding:8px;border-radius:6px;display:flex}
.top-toggle:hover{background:#f0f2f5}
.top-search{flex:1;max-width:340px;position:relative}
.top-search input{width:100%;border:1px solid var(--line);border-radius:20px;padding:7px 14px 7px 34px;background:#f7f8fa;outline:none}
.top-search svg{position:absolute;left:11px;top:9px;color:var(--ink3)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.top-ico{position:relative;color:var(--ink2);background:none;border:none;padding:6px;border-radius:6px;display:flex}
.top-ico:hover{background:#f0f2f5;color:var(--ink)}
.top-ico .dot{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;font-size:9px;border-radius:8px;padding:0 4px;font-weight:700}
.top-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:5px 8px;border-radius:6px;border:none;background:none}
.top-user:hover{background:#f0f2f5}
.top-user .avatar{width:30px;height:30px;font-size:12px}
.top-user span{font-size:13px;color:var(--ink)}
.dropdown{position:absolute;top:52px;right:16px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);width:190px;z-index:400;display:none}
.dropdown.show{display:block}
.dropdown button{display:block;width:100%;text-align:left;border:none;background:none;padding:10px 16px;font-size:13px;color:var(--ink)}
.dropdown button:hover{background:#f4f8f7;color:var(--accent-d)}
.dropdown hr{border:none;border-top:1px solid var(--line)}

.content{padding:18px 22px 60px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px;margin-bottom:14px}
.crumb b{color:var(--ink);font-weight:600}
.crumb .sep{color:var(--ink3)}
.crumb .right{margin-left:auto;display:flex;gap:8px}
.page-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.page-title-row h2{font-size:19px;font-weight:600;color:var(--ink)}
.page-title-row .sub{font-size:12px;color:var(--ink2);margin-top:2px}

/* ================= 面板 ================= */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);margin-bottom:18px}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-h h3{font-size:14px;font-weight:600;color:var(--ink)}
.panel-h .sub{font-size:11px;color:var(--ink3);font-weight:400}
.panel-h .tools{margin-left:auto;display:flex;gap:6px}
.panel-b{padding:16px}
.panel-b.flush{padding:0}

/* ================= 统计卡片 ================= */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.stat-grid.g3{grid-template-columns:repeat(3,1fr)}
.stat-grid.g6{grid-template-columns:repeat(6,1fr)}
.stat{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:16px 18px;position:relative;overflow:hidden}
.stat .ic{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.stat .lb{color:var(--ink2);font-size:12px}
.stat .vl{font-size:26px;font-weight:700;margin-top:4px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .vl small{font-size:13px;color:var(--ink2);font-weight:500}
.stat .ft{font-size:12px;margin-top:6px;color:var(--ink2)}
.stat .ft .up{color:#1e9e6a;font-weight:600}.stat .ft .dn{color:var(--red);font-weight:600}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.stat.s2::before{background:var(--blue)}.stat.s3::before{background:var(--orange)}.stat.s4::before{background:var(--purple)}
.stat.s5::before{background:var(--red)}.stat.s6::before{background:#5b7a99}

/* ================= 表格 ================= */
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:#fbfcfd}
.tbar input[type=text],.tbar input[type=search]{border:1px solid var(--line);border-radius:5px;padding:7px 11px;width:220px;outline:none;background:#fff}
.tbar input:focus{border-color:var(--accent)}
.tbar select{border:1px solid var(--line);border-radius:5px;padding:7px 9px;background:#fff;outline:none}
.tbar .grow{flex:1}
table.gt{width:100%;border-collapse:collapse;font-size:13px}
.gt th{background:#f5f7f9;color:#5a6b7e;font-weight:600;text-align:left;padding:10px 14px;border-bottom:2px solid var(--line);white-space:nowrap;user-select:none}
.gt th.sortable{cursor:pointer}
.gt th.sortable:hover{color:var(--accent-d)}
.gt th .arr{font-size:9px;color:var(--ink3);margin-left:3px}
.gt td{padding:10px 14px;border-bottom:1px solid #eef1f4;white-space:nowrap;font-variant-numeric:tabular-nums}
.gt tbody tr:hover{background:#f6fbfa}
.gt tbody tr:last-child td{border-bottom:none}
.tfoot{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.tfoot .info{color:var(--ink2);font-size:12px}
.pager{margin-left:auto;display:flex;gap:4px}
.pager button{border:1px solid var(--line);background:#fff;color:var(--ink);min-width:30px;height:30px;border-radius:5px;font-size:12px;padding:0 8px}
.pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent-d)}
.pager button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pager button:disabled{opacity:.4;cursor:not-allowed}

/* ================= 标签/按钮/表单/页签 ================= */
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600;white-space:nowrap}
.tg-green{background:#e2f7ef;color:#12805c}.tg-red{background:#fdeceb;color:#c0392b}
.tg-orange{background:#fef4e2;color:#b9770e}.tg-blue{background:#e8f1fb;color:#2470a8}
.tg-gray{background:#eef1f4;color:#6b7b8c}.tg-purple{background:#f3e9f7;color:#7d3c98}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:5px;font-size:13px;padding:7px 14px;font-weight:500;transition:.15s;background:#fff}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent-d)}
.btn-d{background:#fff;border-color:#d5dce3;color:var(--ink)}.btn-d:hover{border-color:var(--accent);color:var(--accent-d)}
.btn-r{background:var(--red);color:#fff}.btn-r:hover{background:#c0392b}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{background:#2470a8}
.btn-w{background:var(--orange);color:#fff}.btn-w:hover{background:#b9770e}
.btn-xs{padding:3px 9px;font-size:12px;border-radius:4px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.frow{margin-bottom:14px}
.frow label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.frow label .req{color:var(--red)}
.frow input,.frow select,.frow textarea{width:100%;border:1px solid #d5dce3;border-radius:5px;padding:8px 11px;outline:none;background:#fff}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,188,156,.12)}
.frow .err{color:var(--red);font-size:11px;margin-top:3px;display:none}
.frow.bad input,.frow.bad select{border-color:var(--red)}
.frow.bad .err{display:block}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:0;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:9px 16px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500}
.tabs button:hover{color:var(--accent-d)}
.tabs button.on{color:var(--accent-d);border-bottom-color:var(--accent);font-weight:700}
.tabs button .cnt{background:#eef1f4;color:var(--ink2);font-size:10px;border-radius:8px;padding:1px 7px;margin-left:5px}
.tabs button.on .cnt{background:var(--accent);color:#fff}

/* ================= 弹窗/抽屉/提示 ================= */
.mask{position:fixed;inset:0;background:rgba(30,45,60,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;border-radius:8px;box-shadow:0 16px 46px rgba(0,0,0,.3);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;animation:mup .18s ease}
@keyframes mup{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-h b{font-size:15px}
.modal-h .x{margin-left:auto;border:none;background:#f0f2f5;width:28px;height:28px;border-radius:6px;color:var(--ink2);font-size:14px}
.modal-h .x:hover{background:#e3e8ee}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--body);z-index:490;box-shadow:-10px 0 34px rgba(0,0,0,.2);overflow-y:auto;animation:sin .2s ease}
@keyframes sin{from{transform:translateX(50px);opacity:.5}to{transform:none;opacity:1}}
.drawer-h{position:sticky;top:0;z-index:5;background:var(--side);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px}
.drawer-h .x{margin-left:auto;border:none;background:rgba(255,255,255,.15);color:#fff;width:28px;height:28px;border-radius:6px}
.drawer-b{padding:16px 20px 40px}
.toasts{position:fixed;top:66px;right:18px;z-index:600;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border-left:4px solid var(--accent);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:11px 16px;font-size:13px;min-width:240px;max-width:360px;animation:tin .2s ease;display:flex;gap:9px;align-items:center}
.toast.err{border-left-color:var(--red)}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

/* ================= 详情/进度/时间线 ================= */
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #e8edf1;font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink2)}.kv .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.prog{height:8px;background:#edf1f4;border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tline{position:relative;padding-left:26px}
.tline:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:#dbe4ec}
.tl-item{position:relative;padding-bottom:16px}
.tl-item .dot{position:absolute;left:-24px;top:3px;width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #dbe4ec;background:var(--accent)}
.tl-item .tm{font-size:11px;color:var(--ink3)}
.tl-item b{font-size:13px}
.tl-item p{font-size:12px;color:var(--ink2);margin-top:2px}
.note{background:#fffbe9;border:1px solid #f3e6b3;border-radius:6px;padding:10px 14px;font-size:12px;color:#8a6d1a}
.note.green{background:#eafaf6;border-color:#bfe9de;color:#0f7a63}
.note.red{background:#fdeceb;border-color:#f5c6c0;color:#a93226}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart-tip{font-size:10px;fill:#8496a9}
.empty{padding:40px;text-align:center;color:var(--ink3);font-size:13px}
.formula{background:#f6fbf9;border:1px dashed #bfe0d3;border-radius:6px;padding:9px 13px;font-size:12.5px;color:#0f7a63;font-family:"Cambria Math",Georgia,serif}
.perm-grid td,.perm-grid th{text-align:center}
.perm-grid td:first-child,.perm-grid th:first-child{text-align:left}

/* ================= 响应式 ================= */
.mask-nav{display:none}
@media(max-width:1080px){.stat-grid,.stat-grid.g6{grid-template-columns:repeat(2,1fr)}.stat-grid.g3{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:860px){
  .sidebar{left:-230px}
  .sidebar.open{left:0}
  .mask-nav.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:290}
  .main{margin-left:0}
  .content{padding:14px 12px 60px}
  .f2,.f3{grid-template-columns:1fr}
  .gt th,.gt td{padding:8px 9px}
  .top-search{display:none}
  .stat-grid.g3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ================= 登录页 ================= -->
<div class="login-wrap show" id="loginWrap">
  <div class="login-card" id="loginCard">
    <div class="login-head">
      <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 21c-4.5-2.2-7-5.6-7-9.5C5 7 8 4 12 4s7 3 7 7.5c0 3.9-2.5 7.3-7 9.5Z" stroke="#fff" stroke-width="1.6"/><path d="M12 4v17M12 9c-2 1-3.5 1-5 .5M12 13c2-1 3.5-1 5-.5" stroke="#e6fff6" stroke-width="1.3" stroke-linecap="round"/></svg></div>
      <h1>e叶知秋授信平台</h1>
      <p>基于"天眼+地账"双核核验的茶农收益穿透式评估与动态授信系统</p>
    </div>
    <div class="login-body">
      <div class="tip">内置账号：<b>admin</b>（管理员）/ <b>lxf</b>（客户经理）/ <b>hzm</b>（风控主管）/ <b>cgp</b>（支行行长）/ <b>coop01</b>（合作社），密码均为 <b>123456</b></div>
      <div class="frow" id="lgUserRow"><label>账号 <span class="req">*</span></label><input id="lgUser" type="text" placeholder="请输入账号" autocomplete="username" value="admin"><div class="err">请输入账号</div></div>
      <div class="frow" id="lgPassRow"><label>密码 <span class="req">*</span></label><input id="lgPass" type="password" placeholder="请输入密码" autocomplete="current-password"><div class="err" id="lgPassErr">请输入密码</div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:12px;color:var(--ink2)">
        <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="lgRemember" checked style="width:auto"> 记住登录状态</label>
        <span>不同角色登录后菜单范围不同</span>
      </div>
      <button class="btn btn-p" style="width:100%;justify-content:center;padding:10px;font-size:14px" onclick="doLogin()">登 录</button>
      <p style="text-align:center;font-size:11px;color:var(--ink3);margin-top:16px">安溪县铁观音主产区 · 感德 / 祥华 / 西坪三乡镇联网运行</p>
    </div>
  </div>
</div>

<!-- ================= 后台主体 ================= -->
<div class="app" id="app">
  <div class="mask-nav" id="maskNav" onclick="toggleSide(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21c-4.5-2.2-7-5.6-7-9.5C5 7 8 4 12 4s7 3 7 7.5c0 3.9-2.5 7.3-7 9.5Z" stroke="#fff" stroke-width="1.8"/></svg></div>
      <div><b>e叶知秋</b><span>茶农动态授信平台</span></div>
    </div>
    <div class="side-profile">
      <div class="avatar" id="sideAvatar">行</div>
      <div><div class="who" id="sideWho">系统管理员</div><div class="role" id="sideRole">合作银行A支行 · 风控部</div></div>

/* ---------- 地账重算（采集→核验→评估→授信 数据打通核心） ---------- */
function recalcFromSales(cid){
  const rk=riskOf(cid);const c=cust(cid);if(!c)return;
  const ract=salesOf(cid).reduce((s,x)=>s+x.amount,0);
  if(rk){
    rk.ract=ract;
    rk.delta=rk.rhat>0?+((ract-rk.rhat)/rk.rhat).toFixed(3):0;
    const ad=Math.abs(rk.delta);
    rk.level=cid==='AX-XP-0088'?'高':(ad>DB.settings.th3?'高':(ad>DB.settings.th2?'中':'低'));
    rk.verdict=cid==='AX-XP-0088'?'异常—拦截':(ad<=DB.settings.th2?'一致—正常':(ad<=DB.settings.th3?'关注—待核':'异常—实核'));
    rk.date=today();
    // 高风险自动生成预警
    if(rk.level==='高'&&!DB.warns.some(w=>w.cid===cid&&w.type==='双账显著不符'&&w.st!=='已办结')){
      DB.warns.push({id:'YJ'+(DB.seq.yj++),cid:cid,type:'双账显著不符',level:'高',src:'二级多源交叉比对',date:today(),st:'待处置',act:'Δ='+(rk.delta>0?'+':'')+rk.delta.toFixed(3)+' 超出三级阈值，转三级实地复核'});
      toast('已自动生成「双账显著不符」高风险预警',false);
    }
  }
  // 动态调额：采期流水超进度预期部分按 α 上调
  const cr=creditOf(cid);
  if(cr&&cr.status!=='已冻结'){
    const expected=rk?rk.rhat*0.45:0;
    const excess=Math.max(0,ract-expected);
    const newAdd=Math.round(excess*DB.settings.alpha/100)*100;
    if(newAdd!==cr.dynAdd){
      cr.dynAdd=newAdd;cr.total=cr.base+newAdd;
      toast('流水驱动动态调额：'+cust(c.id).name+'可用额度调整为 '+fmt(cr.total)+' 元');
    }
  }
}

function chartDonut(items,centerTop,centerBottom,w,h){
  w=w||210;h=h||210;

const TBL={};
function tblState(key){if(!TBL[key])TBL[key]={page:1,size:8,kw:'',sk:null,sd:1,f:{}};return TBL[key]}
function tblSet(key,field,val){const st=tblState(key);if(field==='kw'){st.kw=val;st.page=1}else if(field==='size'){st.size=+val;st.page=1}else if(field.startsWith('f_')){st.f[field.slice(2)]=val;st.page=1}render()}
function tblSort(key,sk){const st=tblState(key);if(st.sk===sk)st.sd*=-1;else{st.sk=sk;st.sd=1}render()}
function tblPage(key,p){tblState(key).page=p;render()}
function buildTable(key,cfg){
  const st=tblState(key);
  let rows=cfg.rows.slice();
  Object.keys(st.f).forEach(fk=>{const v=st.f[fk];if(v!==undefined&&v!=='')rows=rows.filter(r=>String(cfg.fval?cfg.fval(r,fk):r[fk])===String(v))});
  if(st.kw){const kw=st.kw.trim().toLowerCase();rows=rows.filter(r=>cfg.searchText(r).toLowerCase().includes(kw))}
  if(st.sk){const col=cfg.cols.find(c=>c.k===st.sk);rows.sort((a,b)=>{let va=col.sortVal?col.sortVal(a):a[st.sk],vb=col.sortVal?col.sortVal(b):b[st.sk];if(typeof va==='string')return va.localeCompare(vb,'zh')*st.sd;return((va>vb)-(va<vb))*st.sd})}
  const total=rows.length,pages=Math.max(1,Math.ceil(total/st.size));
  if(st.page>pages)st.page=pages;
  const list=rows.slice((st.page-1)*st.size,st.page*st.size);
  let h='<div class="tbar"><input type="text" placeholder="'+(cfg.searchPh||'输入关键字搜索')+'" value="'+esc(st.kw)+'" oninput="tblSet(\''+key+'\',\'kw\',this.value)">';
  (cfg.filters||[]).forEach(f=>{
    h+='<select onchange="tblSet(\''+key+'\',\'f_'+f.k+'\',this.value)"><option value="">'+f.label+'：全部</option>'+
    f.options.map(o=>'<option value="'+esc(o.v)+'" '+(String(st.f[f.k])===String(o.v)?'selected':'')+'>'+esc(o.t)+'</option>').join('')+'</select>';
  });
  h+='<span class="grow"></span><select onchange="tblSet(\''+key+'\',\'size\',this.value)">'+[8,15,30].map(n=>'<option '+(st.size===n?'selected':'')+' value="'+n+'">每页 '+n+' 条</option>').join('')+'</select></div>';
  h+='<div style="overflow-x:auto"><table class="gt"><thead><tr>'+cfg.cols.map(c=>{
    const arr=st.sk===c.k?('<span class="arr">'+(st.sd>0?'▲':'▼')+'</span>'):'<span class="arr">▲▼</span>';
    return '<th '+(c.sort?'class="sortable" onclick="tblSort(\''+key+'\',\''+c.k+'\')"':'')+'>'+c.t+(c.sort?arr:'')+'</th>';
  }).join('')+'</tr></thead><tbody>';
  if(!list.length)h+='<tr><td colspan="'+cfg.cols.length+'"><div class="empty">没有符合条件的记录</div></td></tr>';
  list.forEach(r=>{h+='<tr>'+cfg.cols.map(c=>'<td>'+(c.render?c.render(r):esc(r[c.k]))+'</td>').join('')+'</tr>'});
  h+='</tbody></table></div>';
  h+='<div class="tfoot"><span class="info">共 '+total+' 条记录，第 '+st.page+' / '+pages+' 页</span><div class="pager">';
  h+='<button '+(st.page<=1?'disabled':'')+' onclick="tblPage(\''+key+'\','+(st.page-1)+')">上一页</button>';
  const win=[];for(let p=1;p<=pages;p++){if(p===1||p===pages||Math.abs(p-st.page)<=1)win.push(p)}
  let last=0;win.forEach(p=>{if(p-last>1)h+='<button disabled>…</button>';h+='<button class="'+(p===st.page?'on':'')+'" onclick="tblPage(\''+key+'\','+p+')">'+p+'</button>';last=p});
  h+='<button '+(st.page>=pages?'disabled':'')+' onclick="tblPage(\''+key+'\','+(st.page+1)+')">下一页</button></div></div>';
  return h;
}

function saveCust(id){
  if(!validate(['cuName','cuPhone','cuArea','cuRounds','cuM']))return;
  const area=parseFloat($('cuArea').value),M=parseFloat($('cuM').value),rounds=parseInt($('cuRounds').value);
  if(!(area>0)){fieldErr('cuArea','面积必须大于 0');return}
  if(!(M>=0&&M<=1)){fieldErr('cuM','M 必须在 0~1 之间');return}
  const town=$('cuTown').value;
  const obj={name:$('cuName').value.trim(),phone:$('cuPhone').value.trim(),town:town,village:$('cuVillage').value,coop:COOPS[town],
    area:area,alt:parseInt($('cuAlt').value)||700,rounds:Math.max(1,Math.min(6,rounds)),M:M,treeAge:parseInt($('cuAge').value)||10,
    tier:M>=0.66?2:(M>=0.36?1:0),d:+(0.05+M*0.17).toFixed(3),r:+(0.01+M*0.042).toFixed(3)};
  if(id){
    Object.assign(cust(id),obj);
    const rk=riskOf(id);
    if(rk){rk.rhat=Math.round(area*DB.settings.ybase*(0.38+0.40*M)*105.6*(0.80+0.34*M));rk.M=M;rk.rounds=obj.rounds;recalcFromSales(id)}
    const mainPlot=DB.plots.find(p=>p.cid===id);
    if(mainPlot){mainPlot.areaR=area;mainPlot.alt=obj.alt;mainPlot.treeAge=obj.treeAge}
    toast('客户 '+id+' 信息已更新，物理账与风险判定已重算');
  }else{
    const nid='AX-'+TCODE[town]+'-'+String(DB.seq.cust++).padStart(4,'0');
    DB.customers.push({id:nid,idcard:'',joinDate:today(),status:'正常',...obj});
    DB.risks.push({id:'FX'+(DB.seq.fx++),cid:nid,rhat:Math.round(area*DB.settings.ybase*(0.38+0.40*M)*105.6*(0.80+0.34*M)),ract:0,delta:0,level:'低',verdict:'待台账积累',date:today(),M:M,rounds:obj.rounds});
    DB.plots.push({id:TCODE[town]+'-'+VCODE[$('cuVillage').value]+'-'+String(DB.seq.plot++).slice(-3),cid:nid,areaR:area,areaD:area,alt:obj.alt,treeAge:obj.treeAge,owner:'承包经营权在册',buildDate:today(),status:'正常'});
    toast('新客户已建档赋码 '+nid+'，地块与评估档案同步生成');
  }
  saveDB();closeModal();render();
}

function savePlot(id){
  if(!validate(['plAreaR','plAreaD']))return;
  const aR=parseFloat($('plAreaR').value),aD=parseFloat($('plAreaD').value);
  if(!(aR>0)||!(aD>0)){fieldErr('plAreaR','面积必须大于 0');return}
  const cid=$('plCust').value;const c=cust(cid);
  if(id){
    const p=DB.plots.find(x=>x.id===id);
    Object.assign(p,{cid:cid,areaR:aR,areaD:aD,alt:parseInt($('plAlt').value)||700,treeAge:parseInt($('plAge').value)||10,status:$('plStatus').value});
    toast('地块 '+id+' 已更新');
  }else{
    const nid=TCODE[c.town]+'-'+VCODE[c.village]+'-'+String(DB.seq.plot++).slice(-3);
    DB.plots.push({id:nid,cid:cid,areaR:aR,areaD:aD,alt:parseInt($('plAlt').value)||700,treeAge:parseInt($('plAge').value)||10,owner:'承包经营权在册',buildDate:today(),status:$('plStatus').value});
    toast('新地块已建档赋码 '+nid);
  }
  // 面积偏差预警联动
  if((aD-aR)/aR>0.15&&!DB.warns.some(w=>w.cid===cid&&w.type==='申报面积偏差'&&w.st!=='已办结')){
    DB.warns.push({id:'YJ'+(DB.seq.yj++),cid:cid,type:'申报面积偏差',level:'中',src:'一级全量无感筛查',date:today(),st:'待处置',act:'申报面积较遥感量算偏高 '+Math.round((aD-aR)/aR*100)+'%，按遥感面积建档授信'});
    toast('申报面积偏差超 15%，已自动生成预警',false);
  }
  saveDB();closeModal();render();
}
function delPlot(id){
  openConfirm('删除地块','确认删除地块 <b>'+id+'</b> 的建档信息？',function(){
    DB.plots=DB.plots.filter(p=>p.id!==id);

function syncSalePrice(keepAmount){
  const r=$('slRound').value,g=$('slGrade').value;
  if(!keepAmount)$('slPrice').value=Math.round(ROUND_PRICE[r]*GRADE_F[g]);
  calcSaleAmount();
}
function calcSaleAmount(){
  const n=parseFloat($('slNet').value)||0,p=parseFloat($('slPrice').value)||0;
  $('slAmount').value=Math.round(n*p);
}
function saveSale(no){
  if(!validate(['slDate','slTime','slNet','slPrice']))return;
  const net=parseFloat($('slNet').value),price=parseFloat($('slPrice').value);
  if(!(net>0)||!(price>0)){fieldErr('slNet','净重与单价必须大于 0');return}
  const cid=$('slCust').value;const c=cust(cid);
  const amt=Math.round(net*price);
  if(no){
    const s=DB.sales.find(x=>x.no===no);
    const oldCid=s.cid;
    Object.assign(s,{cid:cid,round:$('slRound').value,grade:$('slGrade').value,date:$('slDate').value,time:$('slTime').value,net:net,price:price,amount:amt,coop:c.coop});
    recalcFromSales(cid);if(oldCid!==cid)recalcFromSales(oldCid);
    toast('交售单 '+no+' 已更新，双账与额度已重算');
  }else{
    const nno=TCODE[c.town]+$('slDate').value.replace(/-/g,'')+String(1000+DB.seq.sale++).slice(1);
    DB.sales.push({no:nno,cid:cid,round:$('slRound').value,grade:$('slGrade').value,date:$('slDate').value,time:$('slTime').value,net:net,price:price,amount:amt,coop:c.coop,devfp:'BS-'+TCODE[c.town]+'-01'});
    recalcFromSales(cid);
    toast('交售单 '+nno+' 已加密上传，经济账实时更新');
  }
  saveDB();closeModal();render();
}
function delSale(no){
  const s=DB.sales.find(x=>x.no===no);
  openConfirm('删除交售单','确认删除交售单 <b>'+no+'</b>（'+fmt(s.amount)+' 元）？该户经济账、Δ 判定与动态额度将实时重算。',function(){
    const cid=s.cid;
    DB.sales=DB.sales.filter(x=>x.no!==no);
    recalcFromSales(cid);
    saveDB();render();toast('交售单已删除，双账已重算');
  });
}

function calcLimit(cid){
  const c=cust(cid);const s=DB.settings;
  const y=s.ybase*(0.38+0.40*c.M);
  const q=c.area*y;
  const base0=q*s.ppess*s.deltaLoss*s.kappa;
  const uplift=c.tier===2?1.15:(c.tier===0?0.8:1);
  openModal('额度测算明细 · '+c.id,
   kv('遥感面积 A',c.area.toFixed(1)+' 亩')+
   kv('推算单产 Ŷ',y.toFixed(1)+' kg/亩（'+s.ybase+' × f(M) '+(0.38+0.40*c.M).toFixed(3)+'）')+
   kv('推算产量 Q̂',fmt(q)+' kg')+
   kv('悲观情景价 Ppess',s.ppess+' 元/kg（较三年均价 105.6 下浮约17%）')+
   kv('采运折损 δ × 授信折扣 κ',s.deltaLoss+' × '+s.kappa)+
   kv('悲观情景基准',fmt(base0)+' 元')+
   kv('档位系数','× '+uplift+'（'+TIERS[c.tier]+'）')+
   '<div class="formula" style="margin-top:8px">L₀ = '+fmt(q)+' × '+s.ppess+' × '+s.deltaLoss+' × '+s.kappa+' × '+uplift+' ≈ <b>'+fmt(suggestLimit(c))+' 元</b></div>'+
   '<div class="note green" style="margin-top:10px">按悲观情景核定可避免价格顺周期风险；采期内额度随真实交售流水按 α='+s.alpha+' 动态上调。</div>',
   '<button class="btn btn-d" onclick="closeModal()">关闭</button><button class="btn btn-p" onclick="closeModal();editApp(\'\')">按此额度发起申请</button>');
}

function syncAppSuggest(){
  const el=$('apSuggest');if(!el||!$('apCust'))return;
  const c=cust($('apCust').value);const rk=c?riskOf(c.id):null;
  el.innerHTML=c?'<div class="note green" style="margin-bottom:12px">双账核验：'+(rk?rk.verdict+'，Δ='+(rk.delta>0?'+':'')+rk.delta.toFixed(3):'暂无')+'；系统建议额度 <b>'+fmt(suggestLimit(c))+'</b> 元（<span style="cursor:pointer;text-decoration:underline" onclick="$(\'apAmount\').value='+suggestLimit(c)+'">点击填入</span>）</div>':'';
}
function saveApp(id){
  if(!validate(['apAmount']))return;
  const amount=parseInt($('apAmount').value);
  if(!(amount>=1000&&amount<=500000)){fieldErr('apAmount','金额须在 1,000 ~ 500,000 元之间');return}
  if(id){
    const a=appOf(id);
    Object.assign(a,{cid:$('apCust').value,amount:amount,term:+$('apTerm').value,purpose:$('apPurpose').value,note:$('apNote').value});
    toast('申请 '+id+' 已更新');
  }else{
    const nid='SQ'+(DB.seq.app++);
    DB.apps.push({id:nid,cid:$('apCust').value,amount:amount,term:+$('apTerm').value,purpose:$('apPurpose').value,note:$('apNote').value,date:today(),status:'待初审',channel:'银行柜面代录',node:1});
    toast('申请 '+nid+' 已提交，进入初审环节');
  }
  saveDB();closeModal();render();
}

  openConfirm('删除申请','确认删除授信申请 <b>'+id+'</b>？关联审批流水将一并删除。',function(){

    saveDB();render();toast('申请 '+id+' 已删除');

function approve(id,pass){
  const a=appOf(id);const c=cust(a.cid);const rk=riskOf(a.cid);
  const nodeMap={'待初审':['初审','林晓峰（客户经理）'],'复核中':['复核','黄志明（风控主管）'],'终审中':['终审','陈国平（支行行长）']};
  const nm=nodeMap[a.status];
  openModal((pass?'审批通过':'审批驳回')+' · '+id,
   '<div class="kv"><span class="k">客户 / 金额</span><span class="v">'+esc(custName(a.cid))+' / '+fmt(a.amount)+' 元</span></div>'+
   '<div class="kv" style="margin-bottom:12px"><span class="k">当前节点</span><span class="v">'+nm[0]+'（'+nm[1]+'）</span></div>'+
   (pass&&a.status==='终审中'?fInput('apLimit','核定基础额度（元）',suggestLimit(c),true,'number','500'):'')+
   '<div class="frow"><label>审批意见 <span class="req">*</span></label><textarea id="apComment" rows="3">'+(pass?(rk?'双账核验「'+rk.verdict+'」，Δ='+(rk.delta>0?'+':'')+rk.delta.toFixed(3)+'，同意'+(a.status==='终审中'?'核额放款':'上报下一环节')+'。':'同意上报下一环节。'):'双账核验存在无法解释的缺口，予以驳回。')+'</textarea><div class="err">请填写审批意见</div></div>',
   '<button class="btn btn-d" onclick="closeModal()">取消</button><button class="btn '+(pass?'btn-p':'btn-r')+'" onclick="doApprove(\''+id+'\','+pass+')">确认'+(pass?'通过':'驳回')+'</button>');
}
function suggestLimit(c){
  if(!c)return 10000;
  const s=DB.settings;
  const y=s.ybase*(0.38+0.40*c.M);
  let L=c.area*y*s.ppess*s.deltaLoss*s.kappa;
  if(c.tier===2)L*=1.15;if(c.tier===0)L*=0.8;
  return Math.round(L/500)*500;
}
function doApprove(id,pass){
  if(!validate(['apComment']))return;
  const a=appOf(id);const c=cust(a.cid);
  const nodeMap={'待初审':['初审','林晓峰（客户经理）'],'复核中':['复核','黄志明（风控主管）'],'终审中':['终审','陈国平（支行行长）']};
  const nm=nodeMap[a.status];
  const comment=$('apComment').value.trim();
  const time=today()+' '+new Date().toTimeString().slice(0,5);
  if(!pass){
    DB.flows.push({id:DB.seq.fl++,appId:id,node:nm[0],op:nm[1],act:'拒绝',time:time,comment:comment});
    a.status='已拒绝';a.node=0;
    toast('申请 '+id+' 已驳回',false);
  }else if(a.status==='终审中'){
    const limit=parseInt($('apLimit').value)||suggestLimit(c);
    DB.flows.push({id:DB.seq.fl++,appId:id,node:'终审',op:nm[1],act:'通过',time:time,comment:comment});
    DB.flows.push({id:DB.seq.fl++,appId:id,node:'放款',op:'系统',act:'放款',time:time,comment:'额度 '+fmt(limit)+' 元已生效，受托支付通道开启。'});
    a.status='已放款';a.node=0;
    const rate=+(DB.settings.lpr+(c.tier===2?0.55:(c.tier===1?1.20:1.70))).toFixed(2);
    DB.credits.push({id:'CR'+(DB.seq.cr++),cid:a.cid,base:limit,dynAdd:0,total:limit,used:0,rate:rate,grantDate:today(),expireDate:addMonths(today(),a.term),status:'正常',term:a.term});
    recalcFromSales(a.cid);
    genRepaySchedule(a.cid);
    toast('终审通过，额度 '+fmt(limit)+' 元已放款生效');
  }else{
    DB.flows.push({id:DB.seq.fl++,appId:id,node:nm[0],op:nm[1],act:'通过',time:time,comment:comment});
    a.status=a.status==='待初审'?'复核中':'终审中';a.node++;
    toast(nm[0]+'已通过，流转至'+(a.status==='复核中'?'复核':'终审')+'环节');
  }
  saveDB();closeModal();render();
}
function genRepaySchedule(cid){
  const cr=DB.credits.find(x=>x.cid===cid);
  if(!cr||DB.repays.some(r=>r.creditId===cr.id))return;
  const used=cr.used||Math.round(cr.total*0.3);
  if(cr.used===0)cr.used=used;
  const per=Math.round(used/cr.term),interest=Math.round(used*cr.rate/100/12);
  for(let m=1;m<=cr.term;m++){
    DB.repays.push({id:'HK'+(DB.seq.hk++),cid:cid,creditId:cr.id,period:m,dueDate:addMonths(cr.grantDate,m),amount:per+interest,payDate:null,status:'待还款'});
  }
}

function reassess(cid){
  const rk=riskOf(cid);const c=cust(cid);
  const rnd=mulberry32((Date.now()%100000)+cid.length);
  rk.rhat=Math.round(c.area*DB.settings.ybase*(0.38+0.40*c.M)*105.6*(0.80+0.34*c.M));
  const saleSum=salesOf(cid).reduce((s,x)=>s+x.amount,0);
  rk.ract=saleSum||Math.round(rk.rhat*(1+(rnd()-0.5)*0.36));
  rk.delta=rk.rhat>0?+((rk.ract-rk.rhat)/rk.rhat).toFixed(3):0;
  const ad=Math.abs(rk.delta);
  rk.level=cid==='AX-XP-0088'?'高':(ad>DB.settings.th3?'高':(ad>DB.settings.th2?'中':'低'));
  rk.verdict=cid==='AX-XP-0088'?'异常—拦截':(ad<=DB.settings.th2?'一致—正常':(ad<=DB.settings.th3?'关注—待核':'异常—实核'));
  rk.date=today();
  saveDB();render();toast('已完成 '+custName(cid)+' 的双账重新核验，判定「'+rk.verdict+'」');
}

function saveRepay(id){
  if(!validate(['rpAmount','rpDate']))return;
  const r=DB.repays.find(x=>x.id===id);
  const amt=parseInt($('rpAmount').value);
  if(!(amt>0)){fieldErr('rpAmount','金额必须大于 0');return}
  const wasOverdue=r.status==='逾期';
  r.amount=amt;r.payDate=$('rpDate').value;r.status='已还清';
  const cr=DB.credits.find(x=>x.id===r.creditId);
  if(cr)cr.used=Math.max(0,cr.used-Math.round(amt*0.85));
  if(wasOverdue){
    const w=DB.warns.find(x=>x.cid===r.cid&&x.type==='还款逾期'&&x.st!=='已办结');
    if(w){w.st='已办结';w.act='逾期款项已收回，台账销号'}
  }
  saveDB();closeModal();render();toast('还款 '+fmt(amt)+' 元已登记，额度同步释放');
}

      {k:'last',t:'最近登录',sort:true,render:r=>'<span style="font-size:12px">'+r.last+'</span>'},
      {k:'status',t:'状态',render:r=>'<span class="tag '+(r.status==='启用'?'tg-green':'tg-gray')+'">'+r.status+'</span>'},
      {k:'_act',t:'操作',render:r=>'<button class="btn btn-d btn-xs" onclick="editUser(\''+r.u+'\')">编辑</button> <button class="btn btn-d btn-xs" onclick="resetPwd(\''+r.u+'\')">重置密码</button> '+(r.u!=='admin'?'<button class="btn btn-r btn-xs" onclick="delUser(\''+r.u+'\')">删除</button>':'')}
    ]
  });
  const pages=MENUS.filter(m=>!m.sec).map(m=>({id:m.id,name:m.name}));
  const editRoles=ROLES.filter(r=>r!=='系统管理员');
  const matrix='<div style="overflow-x:auto"><table class="gt perm-grid"><thead><tr><th>功能模块</th>'+editRoles.map(r=>'<th>'+r+'</th>').join('')+'</tr></thead><tbody>'+
    pages.map(p=>'<tr><td>'+p.name+'</td>'+editRoles.map(r=>{
      const on=(DB.perms[r]||[]).includes(p.id);
      return '<td><input type="checkbox" '+(on?'checked':'')+' onchange="togglePerm(\''+r+'\',\''+p.id+'\',this.checked)" style="width:16px;height:16px;cursor:pointer"></td>';
    }).join('')+'</tr>').join('')+'</tbody></table></div>';
  return '<div class="crumb"><b>首页</b><span class="sep">/</span>用户与权限管理</div>'+
  '<div class="page-title-row"><div><h2>用户与权限管理</h2><div class="sub">账户体系 · 角色权限矩阵 · 系统管理员拥有全部权限</div></div><button class="btn btn-p" onclick="editUser(\'\')">＋ 新增用户</button></div>'+
  '<div class="panel"><div class="panel-h"><h3>用户账户</h3></div><div class="panel-b flush">'+body+'</div></div>'+
  '<div class="panel"><div class="panel-h"><h3>角色权限矩阵</h3><span class="sub">勾选即时生效：控制各角色可见的菜单与页面</span></div><div class="panel-b flush">'+matrix+'</div></div>';
}
function togglePerm(role,pageId,on){
  if(!DB.perms[role])DB.perms[role]=[];
  if(on&&!DB.perms[role].includes(pageId))DB.perms[role].push(pageId);
  if(!on)DB.perms[role]=DB.perms[role].filter(p=>p!==pageId);
  saveDB();toast('已更新「'+role+'」对「'+MENUS.find(m=>m.id===pageId).name+'」的访问权限');
}
function editUser(u){
  const user=u?DB.users.find(x=>x.u===u):null;
  openModal((user?'编辑用户 · '+user.u:'新增用户'),
   '<div class="f2">'+
   '<div class="frow" id="row_usU"><label>登录账号 <span class="req">*</span></label><input id="usU" value="'+(user?user.u:'')+'" '+(user?'readonly style="background:#f0f4f2"':'')+'><div class="err">请输入账号</div></div>'+
   fInput('usName','姓名 / 机构简称',user?user.name:'',true)+
   '</div><div class="f2">'+
   fSelect('usRole','角色',ROLES,user?user.role:'客户经理',true)+
   fInput('usPhone','联系电话',user?user.phone:'',true)+
   '</div>'+
   fInput('usOrg','所属机构',user?user.org:'合作银行A支行',true)+
   (user?'':fInput('usPwd','初始密码','123456',true))+
   (user?fSelect('usStatus','账户状态',['启用','停用'],user.status,true):''),
   '<button class="btn btn-d" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="saveUser(\''+u+'\')">保存</button>');
}
function saveUser(u){
  if(u){
    if(!validate(['usName','usPhone','usOrg']))return;
    const user=DB.users.find(x=>x.u===u);
    Object.assign(user,{name:$('usName').value,role:$('usRole').value,phone:$('usPhone').value,org:$('usOrg').value,status:$('usStatus').value});
    toast('用户 '+u+' 已更新');
  }else{
    if(!validate(['usU','usName','usPhone','usOrg','usPwd']))return;
    const nu=$('usU').value.trim();
    if(DB.users.some(x=>x.u===nu)){fieldErr('usU','账号已存在');return}
    DB.users.push({u:nu,pwd:$('usPwd').value,name:$('usName').value,role:$('usRole').value,phone:$('usPhone').value,org:$('usOrg').value,status:'启用',last:'—'});
    toast('用户 '+nu+' 已创建');
  }
  saveDB();closeModal();render();
}
function resetPwd(u){
  openConfirm('重置密码','确认将用户 <b>'+u+'</b> 的密码重置为 123456？',function(){
    DB.users.find(x=>x.u===u).pwd='123456';
    saveDB();toast('密码已重置为 123456');
  });
}
function delUser(u){
  openConfirm('删除用户','确认删除用户 <b>'+u+'</b>？删除后该账号将无法登录。',function(){
    DB.users=DB.users.filter(x=>x.u!==u);
    saveDB();render();toast('用户已删除');
  });
}

    kv('授信申请 / 额度',DB.apps.length+' 笔 / '+DB.credits.length+' 户')+

function saveSetting(){
  if(!validate(['stLpr','stAlpha','stTh2','stTh3','stKappa','stDelta','stPpess','stYbase']))return;
  const s=DB.settings;
  s.lpr=+$('stLpr').value;s.alpha=+$('stAlpha').value;s.th2=+$('stTh2').value;s.th3=+$('stTh3').value;
  s.kappa=+$('stKappa').value;s.deltaLoss=+$('stDelta').value;s.ppess=+$('stPpess').value;s.ybase=+$('stYbase').value;
  saveDB();toast('模型参数已保存并即时生效');
}
function savePwd(){
  const v=$('stPwd').value.trim();
  if(!v){toast('请输入新密码',false);return}
  if(v.length<6){toast('密码长度至少 6 位',false);return}
  const user=DB.users.find(x=>x.u===CUR.u);
  if(user){user.pwd=v;saveDB();$('stPwd').value='';toast('密码已修改，下次登录生效')}
}
function resetAll(){
  openConfirm('恢复出厂数据','将清除本机全部业务数据改动（客户、地块、台账、申请、额度、还款、预警、用户、参数），恢复至出厂状态。确认继续？',function(){
    localStorage.removeItem(LS);DB=seedData();saveDB();Object.keys(TBL).forEach(k=>delete TBL[k]);render();toast('已恢复出厂数据');
  });
}
/* 额度测算器（任选客户） */
function calcPicker(){
  const opts=DB.customers.map(c=>'<option value="'+c.id+'">'+c.name+'（'+c.id+' · '+c.town+'）</option>').join('');
  openModal('额度测算器',
   '<div class="frow"><label>选择客户</label><select id="cpCust" onchange="closeModal();calcLimit(this.value)">'+opts+'</select></div>'+

/* =====================================================================
   弹窗 / 抽屉 / 表单 辅助

function openModal(title,body,foot){
  $('overlay').innerHTML='<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><b>'+title+'</b><button class="x" onclick="closeModal()">✕</button></div><div class="modal-b">'+body+'</div>'+(foot?'<div class="modal-f">'+foot+'</div>':'')+'</div></div>';
}
function openConfirm(title,html,onOk){
  window.__onConfirm=onOk;
  openModal(title,'<div style="font-size:13px;line-height:1.7">'+html+'</div>',
  '<button class="btn btn-d" onclick="closeModal()">取消</button><button class="btn btn-r" onclick="window.__onConfirm();closeModal()">确认</button>');
}
function openDrawer(title,sub,body){
  $('overlay').innerHTML='<div class="drawer"><div class="drawer-h"><div><b>'+title+'</b><div style="font-size:11px;opacity:.75;margin-top:2px">'+sub+'</div></div><button class="x" onclick="closeDrawer()">✕</button></div><div class="drawer-b">'+body+'</div></div>';
}
function closeModal(){$('overlay').innerHTML=''}
function closeDrawer(){$('overlay').innerHTML=''}
function kv(k,v){return '<div class="kv"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
function fInput(id,label,val,req,type,step){
  return '<div class="frow" id="row_'+id+'"><label>'+label+(req?' <span class="req">*</span>':'')+'</label><input id="'+id+'" type="'+(type||'text')+'" '+(step?'step="'+step+'"':'')+' value="'+(val===undefined||val===null?'':val)+'"><div class="err">该字段为必填项</div></div>';
}
function fSelect(id,label,options,val,req,onchange){
  return '<div class="frow" id="row_'+id+'"><label>'+label+(req?' <span class="req">*</span>':'')+'</label><select id="'+id+'" '+(onchange?'onchange="'+onchange+'"':'')+'>'+options.map(o=>'<option value="'+esc(o)+'"'+(String(o)===String(val)?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select><div class="err">请选择</div></div>';
}
function fieldErr(id,msg){const row=$('row_'+id);if(row){row.classList.add('bad');row.querySelector('.err').textContent=msg||'该字段为必填项'}}
function validate(ids){
  let ok=true;
  ids.forEach(id=>{
    const el=$(id),row=$('row_'+id);
    if(!el||!row)return;
    const bad=!String(el.value).trim();
    row.classList.toggle('bad',bad);
    if(bad)ok=false;
  });
  if(!ok)toast('请完整填写必填项',false);
  return ok;
}

let PAGE='dash';
let CUR=null; // 当前登录用户
function canAccess(pageId){
  if(!CUR)return false;
  const p=DB.perms[CUR.role]||[];
  return p.includes('*')||p.includes(pageId);
}
function renderMenu(){
  const todo=DB.apps.filter(a=>['待初审','复核中','终审中'].includes(a.status)).length;
  let html='';
  MENUS.forEach(m=>{
    if(m.sec){
      const groupPages=[];let i=MENUS.indexOf(m)+1;
      while(i<MENUS.length&&!MENUS[i].sec){groupPages.push(MENUS[i]);i++}
      if(groupPages.some(x=>canAccess(x.id)))html+='<div class="menu-sec">'+m.sec+'</div>';
      return;
    }
    if(!canAccess(m.id))return;
    html+='<button class="menu-item '+(PAGE===m.id?'on':'')+'" onclick="go(\''+m.id+'\')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+m.icon+'"/></svg>'+m.name+(m.id==='approval'&&todo?'<span class="badge">'+todo+'</span>':'')+'</button>';
  });
  $('menu').innerHTML=html;
  $('todoBadge').textContent=todo;
  $('todoBadge').style.display=todo&&canAccess('approval')?'':'none';
}
function go(p){
  if(!canAccess(p)){toast('当前角色无权访问该模块',false);return}
  PAGE=p;closeModal();render();toggleSide(false);window.scrollTo(0,0);
}
function render(){
  if(!canAccess(PAGE)){const first=MENUS.find(m=>!m.sec&&canAccess(m.id));PAGE=first?first.id:'dash'}
  renderMenu();
  const P={dash:pageDash,collect:pageCollect,plots:pagePlots,cust:pageCustomers,apply:pageApply,approval:pageApproval,credit:pageCredit,assess:pageAssess,risk:pageRisk,warn:pageWarn,repay:pageRepay,report:pageReport,users:pageUsers,setting:pageSetting};
  $('content').innerHTML=(P[PAGE]||pageDash)();
}
function toggleSide(force){
  const sb=$('sidebar'),mk=$('maskNav');
  const open=force!==undefined?force:!sb.classList.contains('open');
  sb.classList.toggle('open',open);mk.classList.toggle('show',open);
}
function globalSearch(kw){
  if(!kw.trim())return;
  if(!canAccess('cust')){toast('当前角色无权访问客户管理',false);return}
  tblState('cust').kw=kw.trim();go('cust');
}
function applyUserUI(){
  $('sideAvatar').textContent=CUR.name.slice(0,1);
  $('topAvatar').textContent=CUR.name.slice(0,1);
  $('sideWho').textContent=CUR.name;
  $('topWho').textContent=CUR.name;
  $('sideRole').textContent=CUR.org+' · '+CUR.role;
  $('dropSetting').style.display=canAccess('setting')?'':'none';
}
function doLogin(){
  const u=$('lgUser').value.trim(),p=$('lgPass').value;
  $('lgUserRow').classList.toggle('bad',!u);
  $('lgPassRow').classList.toggle('bad',!p);
  if(!u||!p)return;
  const user=DB.users.find(x=>x.u===u&&x.pwd===p);
  if(user&&user.status==='启用'){
    CUR=user;
    user.last='2026-10-04 '+new Date().toTimeString().slice(0,5);saveDB();
    if($('lgRemember').checked){try{localStorage.setItem(LS+'_session',u)}catch(e){}}
    $('loginWrap').classList.remove('show');$('app').classList.add('show');
    PAGE='dash';applyUserUI();render();toast('登录成功，'+user.name+'（'+user.role+'）欢迎回来');
  }else{
    $('lgPassErr').textContent=user?'该账号已被停用，请联系系统管理员':'账号或密码错误（内置账号 admin / 123456）';
    $('lgPassRow').classList.add('bad');
    $('loginCard').classList.add('shake');
    setTimeout(()=>$('loginCard').classList.remove('shake'),450);
  }
}
function doLogout(){
  try{localStorage.removeItem(LS+'_session')}catch(e){}
  CUR=null;
  $('app').classList.remove('show');$('loginWrap').classList.add('show');
  $('userDrop').classList.remove('show');
}
document.addEventListener('click',function(e){
  const d=$('userDrop');
  if(d&&d.classList.contains('show')&&!e.target.closest('.top-user')&&!e.target.closest('.dropdown'))d.classList.remove('show');
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&$('loginWrap').classList.contains('show'))doLogin();
});
